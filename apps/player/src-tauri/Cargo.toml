[package]
name = "hyacimicon-player"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
account-core = { path = "../../../core/account" }
account-generator = { path = "../../../research/account_generation" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha1 = "=0.10.6"
tauri = { version = "2", features = [] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
