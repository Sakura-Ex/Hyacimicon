[package]
name = "hyacimicon-player"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace]

[features]
default = []
research = ["dep:account-generator", "dep:futures-util", "dep:image-webp", "dep:png", "dep:reqwest", "dep:rusqlite", "dep:sha1", "dep:zstd"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
account-core = { path = "../../core/account" }
account-generator = { path = "../../research/account_generation", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }
image-webp = { version = "=0.2.4", optional = true }
png = { version = "=0.18.1", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn"], optional = true }
rusqlite = { version = "=0.43.0", features = ["bundled"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha1 = { version = "=0.10.6", optional = true }
tauri = { version = "2", features = [] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
zstd = { version = "=0.13.3", optional = true }
