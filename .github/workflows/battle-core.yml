name: Rust battle core

on:
  push:
    paths: ["core/battle/**", ".github/workflows/battle-core.yml"]
  pull_request:
    paths: ["core/battle/**", ".github/workflows/battle-core.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core/battle
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test core and CLI
        run: cargo test --locked
      - name: Run 10000-trial synthetic smoke test
        run: cargo run --release --locked --bin hcwa-battle -- batch examples/duel.json 10000 20261114 > battle-smoke.json
