name: Post PR comment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      body:
        description: Markdown comment
        required: true
        type: string

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BODY: ${{ inputs.body }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' 'Pull request number must be a positive integer.' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --silent
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --method POST --raw-field "body=$BODY" --jq '.html_url'
