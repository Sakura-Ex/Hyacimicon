<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#120e29">
    <title>货币战争运营实验台</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="game-shell">
      <header class="top-hud">
        <button id="new-run" class="brand-block" type="button" title="创建新对局">
          <span class="brand-mark">CW</span>
          <span>
            <small>OPERATIONS LAB</small>
            <strong>货币战争</strong>
          </span>
        </button>

        <section class="route-hud">
          <div class="stage-caption">
            <small>备战阶段</small>
            <strong id="stage-number">--</strong>
          </div>
          <div id="node-track" class="node-track"></div>
          <div class="health-orb" title="当前生命">
            <span>♥</span>
            <strong id="health">--</strong>
          </div>
        </section>

        <div class="build-chip">
          <span id="game-version">等待数据</span>
          <small id="snapshot-id"></small>
        </div>
      </header>

      <main class="battle-layout">
        <aside class="trait-rail panel">
          <div class="rail-heading">
            <div>
              <small>当前阵容</small>
              <h2>羁绊</h2>
            </div>
            <span id="trait-count">0</span>
          </div>
          <div id="active-traits" class="trait-list"></div>
        </aside>

        <section class="battlefield">
          <div class="field-glow field-glow-a"></div>
          <div class="field-glow field-glow-b"></div>
          <div class="team-counter">
            <span class="team-icon">♙</span>
            <strong id="active-capacity">0/0</strong>
            <small>上阵角色</small>
          </div>

          <section class="unit-row front-row">
            <div class="row-label">
              <span></span>
              <strong>前台区域</strong>
              <span></span>
            </div>
            <div id="front-units" class="unit-slots"></div>
          </section>

          <section class="unit-row back-row">
            <div class="row-label">
              <span></span>
              <strong>后台区域</strong>
              <span></span>
            </div>
            <div id="back-units" class="unit-slots"></div>
          </section>

          <div class="arena-footer">
            <div class="run-context">
              <span id="run-environment">--</span>
              <span id="run-difficulty">--</span>
              <span id="run-plane">--</span>
            </div>
            <div class="progress-mini">
              <span>战斗进度</span>
              <strong id="progress-value">100%</strong>
            </div>
          </div>
        </section>

        <aside class="tool-rail">
          <button type="button" data-drawer="roster">
            <span>▦</span>
            <small>阵容</small>
          </button>
          <button type="button" data-drawer="investments">
            <span>◆</span>
            <small>投资</small>
          </button>
          <button type="button" data-drawer="log">
            <span>≡</span>
            <small>记录</small>
          </button>
          <button type="button" data-drawer="debug">
            <span>⌕</span>
            <small>检查</small>
          </button>
          <button id="export-run" type="button">
            <span>⇩</span>
            <small>导出</small>
          </button>
        </aside>
      </main>

      <footer class="shop-dock">
        <section class="level-card">
          <div>
            <small>购买经验</small>
            <strong>Lv.<span id="level">--</span></strong>
            <span id="xp-line">--</span>
          </div>
          <button id="buy-xp" type="button">
            <span>经验</span>
            <b>+4</b>
          </button>
        </section>

        <section class="shop-area">
          <div class="shop-title">
            <div>
              <small>商店</small>
              <strong id="shop-gold">-- 金币</strong>
            </div>
            <div class="shop-actions">
              <button id="toggle-lock" class="icon-button" type="button" title="锁定商店">锁</button>
              <button id="reroll-shop" class="icon-button" type="button" title="刷新商店">↻</button>
              <span class="free-rerolls">免费 <b id="free-rerolls">0</b></span>
            </div>
          </div>
          <div id="shop" class="shop-row"></div>
        </section>

        <section class="battle-controls">
          <div class="combat-progress">
            <label for="battle-progress">战斗进度</label>
            <div>
              <input id="battle-progress" type="number" min="0" max="100" step="1" value="100">
              <span>%</span>
              <button id="apply-progress" type="button">应用</button>
            </div>
          </div>
          <button id="advance-node" class="battle-button" type="button">
            <span>出战</span>
            <small id="advance-label">结算当前节点</small>
          </button>
        </section>
      </footer>
    </div>

    <section id="start-screen" class="overlay start-screen">
      <div class="start-card">
        <div class="start-copy">
          <p class="eyebrow">CURRENCY WAR • OPERATIONS LAB</p>
          <h1>货币战争运营实验台</h1>
          <p>
            手动执行商店、升级、投资和节点结算。战斗只读取进度，不运行动画或伤害计算。
          </p>
          <div class="data-ribbon">
            <strong id="start-snapshot">正在读取图鉴快照</strong>
            <span id="start-counts"></span>
          </div>
        </div>
        <form id="start-form" class="start-form">
          <label>
            难度
            <select id="difficulty" required></select>
          </label>
          <label>
            投资环境
            <select id="environment"></select>
          </label>
          <div class="form-grid">
            <label>
              随机种子
              <input id="seed" type="number" value="7" step="1" required>
            </label>
            <label>
              战斗进度
              <div class="input-suffix">
                <input id="start-progress" type="number" value="100" min="0" max="100" step="1">
                <span>%</span>
              </div>
            </label>
          </div>
          <button class="primary" type="submit">开始对局</button>
          <p id="meta-status" class="form-note"></p>
        </form>
      </div>
    </section>

    <section id="investment-modal" class="overlay investment-overlay" hidden>
      <div class="investment-card">
        <p class="eyebrow">投资策略</p>
        <h2>选择一项投资</h2>
        <div id="investment-options" class="investment-options"></div>
      </div>
    </section>

    <aside id="drawer" class="drawer" hidden>
      <header>
        <div>
          <small id="drawer-kicker">运行信息</small>
          <h2 id="drawer-title">检查</h2>
        </div>
        <button id="close-drawer" type="button">×</button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>

    <div id="finish-banner" class="finish-banner" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script src="/static/app.js"></script>
  </body>
</html>
